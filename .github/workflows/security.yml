name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory re-scan: new RUSTSEC findings against the shipped lock
    # surface between pushes (EXP-CICD-06). Cron runs in UTC (Mon 03:00 UTC).
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Default deny-all. Jobs re-request only what they need.
permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Bundles shellcheck + pyflakes, so `run:` blocks get linted too.
      # `--user root`: the image runs as `guest`, which cannot write the workspace.
      image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        # Same severity floor as the ShellCheck job, so `run:` blocks are held
        # to one standard instead of two.
        env:
          SHELLCHECK_OPTS: -S warning
        # All workflows in this repo are ours (upstream mirrors removed in
        # 550e20e); the glob keeps any new workflow linted by default
        # (EXP-CICD-09) instead of relying on a hand-maintained list.
        run: actionlint -color .github/workflows/*.yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        # addon/run.sh is excluded: it is the upstream HA add-on script with
        # bashio shebang (#!/usr/bin/with-contenv bashio) and SC2155/SC2164
        # findings; fixing it would churn the add-on launcher for no gain.
        run: shellcheck -S warning scripts/*.sh

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      # The top-level Cargo.lock is the untouched upstream baseline mirror
      # (12 known RUSTSEC findings; we never churn it to avoid upstream
      # merge conflicts). The published add-on lock inside the store
      # mirror is the audited acceptance basis (0 findings at 16ebe55).
      - run: cargo audit
        working-directory: govee2mqtt_security_local/local-source

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}