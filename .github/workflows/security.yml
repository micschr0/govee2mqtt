name: Security

on:
  push:
    branches: [main, 'stable/*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory re-scan: new RUSTSEC findings against the shipped lock
    # surface between pushes (EXP-CICD-06). Cron runs in UTC (Mon 03:00 UTC).
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Default deny-all. Jobs re-request only what they need.
permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Bundles shellcheck + pyflakes, so `run:` blocks get linted too.
      # `--user root`: the image runs as `guest`, which cannot write the workspace.
      image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        # Same severity floor as the ShellCheck job, so `run:` blocks are held
        # to one standard instead of two.
        env:
          SHELLCHECK_OPTS: -S warning
        # All workflows in this repo are ours (upstream mirrors removed in
        # 550e20e); the glob keeps any new workflow linted by default
        # (EXP-CICD-09) instead of relying on a hand-maintained list.
        run: actionlint -color .github/workflows/*.yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S warning scripts/*.sh govee2mqtt_security_local/run.sh

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
      # Audit the sole application lockfile.
      - run: cargo audit
        working-directory: govee2mqtt_security_local/local-source

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/repo,readonly" --workdir /repo \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config .gitleaks.toml --redact=100
