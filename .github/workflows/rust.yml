name: rust

on:
  # The published product is the HA store mirror (govee2mqtt_security_local).
  # The top-level source tree on main is the untouched upstream baseline
  # mirror — CI on it fails under the pinned toolchain and tests code we
  # never ship. Run rust CI only when the shipped source or this workflow
  # changes.
  push:
    branches: [main]
    paths:
      - 'govee2mqtt_security_local/local-source/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'govee2mqtt_security_local/local-source/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # The shipped add-on source, not the upstream baseline mirror.
        working-directory: govee2mqtt_security_local/local-source
    permissions:
      contents: read # checkout requires contents:read for actions/checkout
      pull-requests: write # scttnlsn/covrs posts PR comments and annotations
      checks: write # as check runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # Keep CI aligned with the explicitly pinned store build toolchain.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cache the store source workspace, not the root baseline mirror
          # (rust-cache's default), and cache failing runs too (EXP-CICD-05).
          workspaces: govee2mqtt_security_local/local-source
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage data (lcov)
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
        working-directory: govee2mqtt_security_local/local-source

      - name: Coverage PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: scttnlsn/covrs@0a048b99b9b4b8aaa5d006d60caaf55c8a13c11d # v0.3.2
        with:
          coverage-files: govee2mqtt_security_local/local-source/lcov.info
          annotate: true