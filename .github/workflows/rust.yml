name: rust

on:
  # Development and both container contexts share these sources.
  push:
    branches: [main, 'stable/*']
    paths:
      - 'govee2mqtt_security_local/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'govee2mqtt_security_local/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # Keep CI aligned with the explicitly pinned store build toolchain.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cache the authoritative workspace and failing runs (EXP-CICD-05).
          workspaces: govee2mqtt_security_local/local-source
          cache-on-failure: true

      - name: Verify source, tests and package
        run: make verify

      - name: Docs
        working-directory: govee2mqtt_security_local/local-source
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Fixture runtime checks
        timeout-minutes: 8
        run: make runtime

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Generate coverage and publish summary
        working-directory: govee2mqtt_security_local/local-source
        run: |
          cargo llvm-cov --locked
          cargo llvm-cov report > "$RUNNER_TEMP/coverage-summary.txt"
          {
            printf '## Rust coverage\n\n```text\n'
            cat "$RUNNER_TEMP/coverage-summary.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
