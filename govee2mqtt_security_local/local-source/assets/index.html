<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Govee Controller</title>
      <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
      <link
        href="/assets/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous" />
      <link href="/assets/style.css" rel="stylesheet" />
    <script type="module" src="/assets/color-modes.js"></script>
    <script type="module" src="/assets/components/devices.js"></script>
  </head>
  <body>
    <main class="container p-5">

      <div class="bg-body-tertiary p-5 rounded">
        <p id="list-status" role="status">Loading devices…</p>
        <p id="control-error" class="text-danger" role="alert" hidden></p>
        <table id="devices" class="table" aria-label="Devices" hidden>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Room</th>
              <th scope="col">IP</th>
              <th scope="col">SKU</th>
              <th scope="col">Power</th>
              <th scope="col">Color</th>
              <th scope="col">ID</th>
              <th scope="col" class="device-updated">Update</th>
              <th scope="col">Source</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <template id="device-row">
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td><span class="form-switch"><input class="form-check-input" type="checkbox" role="switch"></span></td>
        <td><input class="form-control form-control-color" type="color"></td>
        <td><code class="text-body"></code></td>
        <td><time></time></td>
        <td><span class="badge rounded-pill text-bg-info" hidden></span></td>
      </tr>
    </template>
  </body>
</html>
